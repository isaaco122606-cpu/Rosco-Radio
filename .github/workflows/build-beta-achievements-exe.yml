name: Build Rosco Radio Beta Achievements EXE

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-beta-achievements-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build patch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download current Beta from NexusUpdater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $server = 'https://nexusupdater.duckdns.org'
          $manifestUrl = "$server/api/v1/apps/rosco-radio/manifest?channel=beta"
          $headers = @{ 'User-Agent' = 'NexusUpdater/0.3' }
          Write-Host "Manifest: $manifestUrl"
          $m = Invoke-RestMethod -Uri $manifestUrl -Headers $headers -TimeoutSec 30
          if (-not $m.package_url) { throw 'Manifest has no package_url' }
          $zip = Join-Path $PWD 'RoscoRadio-Beta.zip'
          Invoke-WebRequest -Uri $m.package_url -Headers $headers -OutFile $zip -TimeoutSec 180
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ([string]$m.sha256).ToLowerInvariant()
          if ($actual -ne $expected) { throw 'NexusUpdater package checksum mismatch' }
          "RR_VERSION=$($m.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Expand-Archive -Path $zip -DestinationPath "$PWD\rrsrc" -Force

      - name: Locate RR source
        shell: pwsh
        run: |
          $main = Get-ChildItem -Path "$PWD\rrsrc" -Filter main.py -Recurse | Select-Object -First 1
          if (-not $main) { throw 'main.py not found in NexusUpdater package' }
          $root = $main.Directory.FullName
          Write-Host "RR source root: $root"
          "RR_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Overlay Achievements build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $rrRoot = (Resolve-Path $env:RR_ROOT).Path
          $relativeRoot = [System.IO.Path]::GetRelativePath($repoRoot, $rrRoot).Replace('\','/')
          $patch = Join-Path $repoRoot 'build\achievements-v0.1.4.patch'
          Set-Location $repoRoot
          Write-Host "Applying achievements patch into $relativeRoot"
          git apply --check --directory="$relativeRoot" $patch
          git apply --directory="$relativeRoot" $patch
          if (-not (Test-Path (Join-Path $rrRoot 'achievements.py'))) { throw 'achievements.py was not created' }
          Select-String -Path (Join-Path $rrRoot 'main.py') -Pattern '_build_achievements_tab' | Write-Host
          Write-Host 'Achievements overlay applied.'

      - name: Compile-check patched source
        shell: pwsh
        run: |
          Set-Location $env:RR_ROOT
          python -m py_compile main.py achievements.py chocolate_rain.py

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "$env:RR_ROOT\requirements.txt") {
            python -m pip install -r "$env:RR_ROOT\requirements.txt"
          }
          python -m pip install pyinstaller

      - name: Build Windows one-file EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:RR_ROOT
          $args = @(
            '--noconfirm',
            '--clean',
            '--onefile',
            '--windowed',
            '--name', "RoscoRadio-v$env:RR_VERSION-Beta-Achievements",
            '--hidden-import', 'PySide6.QtMultimedia',
            '--hidden-import', 'PySide6.QtMultimediaWidgets',
            '--hidden-import', 'sounddevice',
            '--hidden-import', 'cffi',
            '--hidden-import', 'achievements'
          )
          if (Test-Path '.\assets') { $args += @('--add-data', 'assets;assets') }
          if (Test-Path '.\runtime') { $args += @('--add-data', 'runtime;runtime') }
          if (Test-Path '.\intro.mp4') { $args += @('--add-data', 'intro.mp4;.') }
          if (Test-Path '.\config.json') { $args += @('--add-data', 'config.json;.') }
          if (Test-Path '.\ai_build.flag') { $args += @('--add-data', 'ai_build.flag;.') }
          $args += 'main.py'
          python -m PyInstaller @args
          Get-ChildItem '.\dist' | Format-Table Name,Length

      - name: Hash executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:RR_ROOT\dist\*.exe" | Select-Object -First 1
          if (-not $exe) { throw 'EXE was not produced' }
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List
          Copy-Item $exe.FullName "$env:GITHUB_WORKSPACE\RoscoRadio-Beta-Achievements.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RoscoRadio-Beta-Achievements-Windows-x64
          path: RoscoRadio-Beta-Achievements.exe
          retention-days: 7
