name: Build Online Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'installer/gui/**'
      - '.github/workflows/build-online-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows x64 single-file EXE
        shell: pwsh
        run: |
          dotnet publish installer/gui/RoscoRadio.Setup.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o dist
          if (-not (Test-Path 'dist/RoscoRadio-Setup.exe')) { throw 'RoscoRadio-Setup.exe was not produced.' }

      - name: SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/RoscoRadio-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RoscoRadio-Setup.exe" | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoscoRadio-Setup-win-x64
          path: |
            dist/RoscoRadio-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
