name: Fetch virtual audio bundle for ChatGPT env

on:
  push:
    paths:
      - '.github/workflows/fetch-virtual-audio.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    container:
      image: debian:13
    steps:
      - name: Download virtual audio packages
        shell: bash
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip ca-certificates
          mkdir -p /work/debs /work/wheels
          cd /work/debs
          apt-get -o Dir::Cache::archives=/work/debs --download-only install -y \
            pulseaudio pulseaudio-utils libpulse0 libpulse-mainloop-glib0 \
            libportaudio2 jackd2
          rm -f lock || true
          rm -rf partial || true
          python3 -m pip download --only-binary=:all: --dest /work/wheels sounddevice
          ls -lah /work/debs /work/wheels

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: rr-virtual-audio-debian13-x86_64
          path: |
            /work/debs/*.deb
            /work/wheels/*.whl
          retention-days: 1
